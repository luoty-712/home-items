<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E5C4F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232E5C4F'/%3E%3Ctext x='50' y='73' font-size='64' text-anchor='middle' fill='%23F7F3EA' font-family='sans-serif'%3E纳%3C/text%3E%3C/svg%3E">
<title>收纳 · 居家物品智能收纳管理助手</title>
<style>
:root{
  --bg:#F7F3EA;
  --card:#FFFDF9;
  --ink:#223029;
  --ink-2:#4A554D;
  --muted:#8A8F84;
  --green:#2E5C4F;
  --green-deep:#1E3A32;
  --green-soft:#E3EDE6;
  --orange:#C9603A;
  --orange-soft:#FAEDE6;
  --red:#A93B2B;
  --red-soft:#F7E4DF;
  --line:#E4DACB;
  --line-2:#EFE7DA;
  --radius:14px;
  --app-w:460px;
  --shadow:0 1px 2px rgba(34,48,41,.04), 0 6px 18px rgba(34,48,41,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);outline:none;}

/* ---------- 外壳 ---------- */
.app{
  max-width:var(--app-w);margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.02);
}
@media(min-width:520px){
  body{background:#E8E0CF;}
  /* 边框用 inset 阴影画，不占布局宽度，免得底部导航和内容对不齐 */
  .app{box-shadow:inset 1px 0 0 #DCD3C0, inset -1px 0 0 #DCD3C0, 0 0 70px rgba(84,68,44,.09);}
}

/* ---------- 顶部 ---------- */
header{
  padding:18px 20px 12px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 82%,rgba(247,243,234,0));
}
.brand{display:flex;align-items:baseline;justify-content:space-between;}
.brand h1{
  margin:0;font-size:26px;font-weight:800;letter-spacing:.02em;color:var(--green-deep);
  line-height:1.1;
}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;}
.search{
  margin-top:12px;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;box-shadow:var(--shadow);
}
.search svg{flex:none;color:var(--muted);}
.search input{flex:1;border:none;background:none;font-size:15px;}
.search input::placeholder{color:#A9A99C;}
.search .clear{display:none;color:var(--muted);font-size:16px;padding:0 2px;}
.search.has-value .clear{display:block;}

/* ---------- 主体 ---------- */
main{flex:1;overflow-y:auto;padding:4px 20px 110px;scrollbar-width:none;}
main::-webkit-scrollbar{display:none;}
.view{display:none;animation:fade .22s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.section-title{
  display:flex;align-items:center;justify-content:space-between;
  margin:22px 0 10px;font-size:12px;letter-spacing:.12em;color:var(--muted);
}
.section-title b{font-weight:600;color:var(--ink-2);letter-spacing:.06em;}

/* ---------- 提醒卡 ---------- */
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
.alert{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 12px 11px;text-align:left;box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
}
.alert:active{transform:scale(.97);}
.alert .n{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.alert .t{font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.04em;}
.alert.expired .n{color:var(--red);}
.alert.expiring .n{color:var(--orange);}
.alert.idle .n{color:var(--green);}
.alert.zero .n{color:#C9C4B5;}

/* ---------- 物品卡 ---------- */
.list{display:flex;flex-direction:column;gap:9px;}
.item{
  position:relative;display:flex;align-items:stretch;gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px 13px 13px;box-shadow:var(--shadow);overflow:hidden;
  transition:transform .15s ease;
}
.item:active{transform:scale(.985);}
.item .ph{width:46px;height:46px;border-radius:11px;object-fit:cover;flex:none;background:#EFE9DC;display:block;}
.item .bar{width:3px;border-radius:3px;background:var(--line);flex:none;}
.item.s-expired .bar{background:var(--red);}
.item.s-expiring .bar{background:var(--orange);}
.item.s-fresh .bar{background:#7FA88F;}
.item .body{flex:1;min-width:0;}
.item .row1{display:flex;align-items:baseline;gap:8px;}
.item .name{font-weight:650;font-size:15.5px;color:var(--ink);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .qty{flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;}
.item .loc{font-size:12.5px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .tag{
  display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:20px;
  margin-top:7px;letter-spacing:.03em;font-weight:500;
}
.tag.fresh{background:var(--green-soft);color:var(--green);}
.tag.expiring{background:var(--orange-soft);color:var(--orange);}
.tag.expired{background:var(--red-soft);color:var(--red);}
.tag.plain{background:#F1ECE1;color:#8A8474;}
.item .chev{display:flex;align-items:center;color:#CFC7B6;flex:none;}

.cat-badge{
  flex:none;width:38px;height:38px;border-radius:11px;background:var(--green-soft);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  color:var(--green);font-weight:700;
}

/* ---------- 胶囊筛选 ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin-top:6px;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:none;padding:6px 13px;border-radius:20px;font-size:13px;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);white-space:nowrap;
  transition:all .16s ease;
}
.chip.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:500;}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;padding:54px 20px;color:var(--muted);
}
.empty .icon{font-size:34px;opacity:.5;margin-bottom:10px;}
.empty p{margin:4px 0;font-size:13.5px;}

/* ---------- 统计 ---------- */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--green);font-variant-numeric:tabular-nums;}
.stat .k{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.05em;}
.bars{margin-top:6px;display:flex;flex-direction:column;gap:9px;}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
.bar-row .lbl{width:56px;color:var(--ink-2);flex:none;}
.bar-row .track{flex:1;height:6px;border-radius:4px;background:#EFE8DB;overflow:hidden;}
.bar-row .fill{height:100%;border-radius:4px;background:var(--green);opacity:.75;}
.bar-row .num{width:22px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:11.5px;}

.actions{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.act{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;font-size:14px;box-shadow:var(--shadow);
}
.act .r{color:#C9C0AE;font-size:13px;}
.act.danger{color:var(--red);}

/* ---------- 底部导航 ---------- */
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(100%, var(--app-w));margin:0;
  display:flex;background:rgba(255,253,249,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  z-index:30;
}
nav button{
  flex:1;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:#A7A798;font-size:10.5px;letter-spacing:.06em;transition:color .16s;
}
nav button svg{width:21px;height:21px;}
nav button.on{color:var(--green);}
nav button.on svg{stroke-width:2.1;}

/* ---------- FAB ---------- */
.fab{
  --fab-x:calc(min(100vw, var(--app-w)) / 2 - 100% - 18px);
  position:fixed;left:50%;transform:translateX(var(--fab-x));
  bottom:calc(74px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;
  display:flex;align-items:center;justify-content:center;z-index:35;
  box-shadow:0 6px 20px rgba(46,92,79,.34), 0 2px 6px rgba(46,92,79,.2);
  transition:transform .18s ease, box-shadow .18s ease;
}
.fab:active{transform:translateX(var(--fab-x)) scale(.92);}
.fab svg{width:24px;height:24px;}

/* ---------- 抽屉 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(30,42,36,.42);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .24s ease;backdrop-filter:blur(2px);
}
.mask.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:50;
  width:min(100%, var(--app-w));margin:0;background:var(--card);
  border-radius:20px 20px 0 0;padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(102%);opacity:0;
  transition:transform .3s cubic-bezier(.32,.72,0,1), opacity .24s ease;
  max-height:92vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(30,42,36,.18);
  pointer-events:none;
}
.sheet.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}
/* 宽屏上改成居中弹层：底部抽屉在桌面会把「保存」顶出屏幕 */
@media(min-width:520px){
  .sheet{
    top:50%;bottom:auto;max-height:90vh;border-radius:18px;
    transform:translateX(-50%) translateY(-50%) scale(.97);
    box-shadow:0 24px 70px rgba(30,42,36,.28);
  }
  .sheet.show{transform:translateX(-50%) translateY(-50%) scale(1);}
}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:#E2D9C8;margin:6px auto 14px;}
.sheet h2{margin:0 0 4px;font-size:19px;font-weight:750;letter-spacing:.01em;color:var(--green-deep);}
.sheet .hint{font-size:12px;color:var(--muted);margin-bottom:16px;}

.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea{
  width:100%;background:#FBF7EF;border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;font-size:15px;transition:border-color .16s, background .16s;
}
.field input:focus,.field textarea:focus{border-color:var(--green);background:#fff;}
.field textarea{resize:none;min-height:56px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

.cat-pick{display:flex;flex-wrap:wrap;gap:7px;}
.cat-pick button{
  padding:7px 12px;border-radius:9px;font-size:13px;background:#FBF7EF;
  border:1px solid var(--line);color:var(--ink-2);transition:all .14s;
}
.cat-pick button.on{background:var(--green);border-color:var(--green);color:#fff;}

.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#FBF7EF;}
.stepper button{width:38px;height:42px;font-size:18px;color:var(--green);font-weight:600;}
.stepper input{flex:1;text-align:center;border:none;background:none;font-size:15px;width:100%;}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

/* ---------- 照片 ---------- */
.ph-row{display:flex;gap:10px;align-items:center;}
.ph-box{
  width:80px;height:80px;border-radius:12px;border:1px solid var(--line);background:#FBF7EF;
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;flex:none;
  color:#C6BEAC;
}
.ph-box img{width:100%;height:100%;object-fit:cover;display:block;}
.ph-box img[hidden]{display:none;}
.ph-box .ph-icon{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:0;white-space:nowrap;}
.ph-del{
  position:absolute;right:3px;top:3px;width:19px;height:19px;border-radius:50%;
  background:rgba(26,36,31,.6);color:#fff;font-size:11px;line-height:1;display:none;place-items:center;
}
.ph-box.filled .ph-del{display:grid;}
.ph-actions{display:flex;flex-direction:column;justify-content:center;gap:6px;flex:1;min-width:0;}
.field label.has-tip{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.ph-btn{
  padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600;color:var(--green);text-align:center;
}
.ph-btn:active{background:#F3EEE2;}
.ph-btn.ghost{color:var(--muted);font-weight:500;font-size:12.5px;}
.ph-tip{font-size:10.5px;color:var(--muted);line-height:1.45;font-weight:400;text-align:right;}

/* 详情大图 */
.d-photo{width:100%;height:190px;object-fit:cover;border-radius:14px;display:block;margin:0 0 14px;background:#EFE9DC;}

/* 摄像头取景层 */
.cam{position:fixed;inset:0;z-index:70;background:#080B09;display:none;}
.cam.show{display:block;}
.cam video{width:100%;height:100%;object-fit:cover;display:block;background:#000;}
.cam-bar{
  position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;
  padding:20px 26px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0));
}
.cam-bar button{color:#fff;}
.cam-shoot{
  width:66px;height:66px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 5px rgba(255,255,255,.28);transition:transform .12s;
}
.cam-shoot:active{transform:scale(.93);}
.cam-x{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.16);font-size:19px;display:grid;place-items:center;}
.cam-flip{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;}
.cam-hint{
  position:absolute;top:calc(18px + env(safe-area-inset-top));left:0;right:0;text-align:center;
  color:rgba(255,255,255,.82);font-size:12.5px;letter-spacing:.04em;
}

/* 操作按钮吸底：抽屉内容一长，「保存」就不会被顶到滚动区外 */
.sheet-actions{
  display:flex;gap:10px;margin-top:18px;
  position:sticky;bottom:calc(-1 * (22px + env(safe-area-inset-bottom)));
  background:var(--card);padding:10px 0 2px;z-index:2;
}
.btn{
  flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;
  background:var(--green);color:#fff;transition:opacity .15s, transform .15s;letter-spacing:.02em;
}
.btn:active{transform:scale(.98);opacity:.9;}
.btn.ghost{background:#F3EEE2;color:var(--ink-2);font-weight:500;}
.btn.del{background:var(--red-soft);color:var(--red);font-weight:600;flex:none;width:56px;font-size:13px;}
.btn:disabled{opacity:.4;}

/* ---------- 详情 ---------- */
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.detail-head .cat-badge{width:46px;height:46px;border-radius:13px;font-size:17px;}
.detail-head h2{margin:0;font-size:20px;font-weight:750;color:var(--green-deep);}
.detail-head .loc{font-size:12.5px;color:var(--muted);margin-top:2px;}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14px;}
.kv .k{color:var(--muted);font-size:13px;}
.kv .v{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right;}
.kv:last-of-type{border-bottom:none;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:rgba(30,42,36,.94);color:#fff;font-size:13px;letter-spacing:.03em;
  padding:10px 18px;border-radius:22px;z-index:60;opacity:0;pointer-events:none;
  transition:all .26s cubic-bezier(.32,.72,0,1);white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 分隔 ---------- */
.hr{height:1px;background:var(--line-2);margin:22px 0 0;}
.footnote{font-size:11px;color:#B3AC9C;text-align:center;padding:26px 0 10px;letter-spacing:.05em;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <h1>收纳</h1>
      <div class="sub">HOME&nbsp;ITEMS</div>
    </div>
    <div class="search" id="searchBox">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜名称、拼音首字母，如 cdq" autocomplete="off">
      <button class="clear" id="clearQ" aria-label="清空">×</button>
    </div>
  </header>

  <main>
    <!-- 首页 -->
    <section class="view active" id="view-home">
      <div class="section-title"><b>待办提醒</b><span id="todoHint">今天</span></div>
      <div class="alerts">
        <button class="alert expired" data-jump="expired"><div class="n" id="nExpired">0</div><div class="t">已过期</div></button>
        <button class="alert expiring" data-jump="expiring"><div class="n" id="nExpiring">0</div><div class="t">临期 ≤30 天</div></button>
        <button class="alert idle" data-jump="idle"><div class="n" id="nIdle">0</div><div class="t">闲置 180 天</div></button>
      </div>

      <div class="section-title" style="margin-top:26px;"><b>最近录入</b><span id="totalHint">共 0 件</span></div>
      <div class="list" id="recentList"></div>
    </section>

    <!-- 物品 -->
    <section class="view" id="view-items">
      <div class="chips" id="catChips"></div>
      <div class="section-title" style="margin-top:14px;"><b id="itemsTitle">全部物品</b><span id="itemsCount"></span></div>
      <div class="list" id="itemsList"></div>
    </section>

    <!-- 我的 -->
    <section class="view" id="view-me">
      <div class="section-title"><b>库存概览</b><span>实时统计</span></div>
      <div class="stat-grid">
        <div class="stat"><div class="v" id="sTotal">0</div><div class="k">物品总数</div></div>
        <div class="stat"><div class="v" id="sKinds">0</div><div class="k">种类</div></div>
      </div>

      <div class="section-title" style="margin-top:26px;"><b>分类分布</b><span>按件数</span></div>
      <div class="bars" id="catBars"></div>

      <div class="section-title" style="margin-top:26px;"><b>数据管理</b><span>本地保存</span></div>
      <div class="actions">
        <button class="act" id="btnExport">导出备份<span class="r">JSON ›</span></button>
        <button class="act" id="btnImport">导入备份<span class="r">选择文件 ›</span></button>
        <button class="act" id="btnSeed">恢复示例数据<span class="r" id="seedHint">…</span></button>
        <button class="act danger" id="btnClear">清空全部数据<span class="r">不可撤销 ›</span></button>
      </div>

      <div class="footnote">
        数据保存在本机浏览器 · 不上传服务器<br>
        居家物品智能收纳管理助手 · P0
      </div>
    </section>
  </main>

  <nav>
    <button class="on" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      首页
    </button>
    <button data-tab="items">

<script>
"use strict";

/* ==========================================================
   1. 存储层：内存为主 + IndexedDB 持久化，失败降级 localStorage
   ========================================================== */
const DB_NAME = "home_items_db", STORE = "items", LS_KEY = "home_items_v1";
let items = [];
let dbFallback = false;

function openDB(){
  return new Promise((res, rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("no idb"));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath:"id" });
    };
    req.onsuccess = ()=> res(req.result);
    req.onerror = ()=> rej(req.error);
    req.onblocked = ()=> rej(new Error("blocked"));
  });
}

async function idbGetAll(){
  const db = await openDB();
  return new Promise((res, rej)=>{
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = ()=> res(req.result || []);
    req.onerror = ()=> rej(req.error);
  });
}

async function idbReplaceAll(list){
  const db = await openDB();
  return new Promise((res, rej)=>{
    const tx = db.transaction(STORE, "readwrite");
    const os = tx.objectStore(STORE);
    os.clear();
    list.forEach(it => os.put(it));
    tx.oncomplete = ()=> res();
    tx.onerror = ()=> rej(tx.error);
    tx.onabort = ()=> rej(tx.error);
  });
}

async function loadAll(){
  try{
    items = await idbGetAll();
  }catch(err){
    dbFallback = true;
    try{ items = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }catch(e){ items = []; }
  }
  if(!Array.isArray(items)) items = [];
}

let photoDropped = false;   // localStorage 放不下照片时的降级标记

async function persist(){
  photoDropped = false;
  try{
    if(dbFallback) throw new Error("fallback");
    await idbReplaceAll(items);
    return;
  }catch(err){
    dbFallback = true;
  }
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(items));
  }catch(e){
    // 照片把 5MB 撑爆了：先保住文字，再提示
    photoDropped = true;
    try{
      localStorage.setItem(LS_KEY, JSON.stringify(items.map(it => ({ ...it, photo: null }))));
    }catch(e2){}
  }
}

function initials(str){
  if(!str) return "";
  let out = "";
  const s = String(str).toLowerCase();
  for(const ch of s){
    const cp = ch.codePointAt(0);
    if(cp >= PY_START && cp < PY_START + PY_STR.length){
      const c = PY_STR[cp - PY_START];
      if(c !== "-") out += c;
    }else if(/[a-z0-9]/.test(ch)){
      out += ch;
    }
  }
  return out;
}

/* ==========================================================
   3. 工具函数
   ========================================================== */
const CATS = ["生活用品","药品","电子配件","食品","洗护","文具","其他"];
const CAT_SHORT = {"生活用品":"生","药品":"药","电子配件":"电","食品":"食","洗护":"洗","文具":"文","其他":"他"};

function pad(n){ return n < 10 ? "0"+n : ""+n; }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function daysFromNow(dateStr){
  if(!dateStr) return null;
  const t = new Date(dateStr+"T00:00:00").getTime();
  if(isNaN(t)) return null;
  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  return Math.round((t - t0) / 86400000);
}
function statusOf(it){
  const d = daysFromNow(it.expireAt);
  if(d === null) return "fresh";        // 无保质期，按正常处理但不显示有效期标签
  if(d < 0) return "expired";
  if(d <= 30) return "expiring";
  return "fresh";
}
function idleDays(it){
  const base = it.lastUsedAt || it.createdAt;
  if(!base) return 0;
  const t = new Date(base+"T00:00:00").getTime();
  if(isNaN(t)) return 0;
  return Math.round((Date.now() - t) / 86400000);
}
function isIdle(it){ return idleDays(it) >= 180; }

function locText(it){
  return [it.room, it.cabinet, it.drawer].filter(Boolean).join(" · ") || "未标注位置";
}
function uid(){
  return "it_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,7);
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function dateLabel(d){
  if(!d) return "—";
  return d;
}

/* ==========================================================
   4. 种子数据
   ========================================================== */
function daysAgo(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function daysLater(n){ return daysAgo(-n); }

function renderItems(){
  // 分类胶囊
  const qfLabel = { expired:"已过期", expiring:"临期", idle:"闲置" }[quickFilter];
  const cats = ["全部", ...CATS];
  $("catChips").innerHTML =
    (quickFilter ? `<button class="chip on" data-clear="1">${qfLabel} ×</button>` : "") +
    cats.map(c =>
      `<button class="chip ${c === activeCat && !quickFilter ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`
    ).join("");

  const q = $("q").value.trim();
  let list = items.slice();

  if(activeCat !== "全部") list = list.filter(it => it.category === activeCat);

  if(quickFilter === "expired") list = list.filter(it => statusOf(it) === "expired");
  else if(quickFilter === "expiring") list = list.filter(it => statusOf(it) === "expiring");
  else if(quickFilter === "idle") list = list.filter(isIdle);

  if(q){
    const ql = q.toLowerCase();
    list = list.filter(it => {
      const hay = [
        it.name, it.note, it.room, it.cabinet, it.drawer, it.category
      ].filter(Boolean).join(" ").toLowerCase();
      if(hay.includes(ql)) return true;
      if(initials(it.name).includes(ql)) return true;
      return false;
    });
  }

  // 排序：过期的排前面，然后按到期日，无保质期的按录入时间
  list.sort((a,b) => {
    const sa = statusOf(a), sb = statusOf(b);
    const rank = { expired:0, expiring:1, fresh:2 };
    if(rank[sa] !== rank[sb]) return rank[sa] - rank[sb];
    const da = daysFromNow(a.expireAt), db = daysFromNow(b.expireAt);
    if(da !== null && db !== null) return da - db;
    return String(b.createdAt||"").localeCompare(String(a.createdAt||""));
  });

  $("itemsTitle").textContent = q ? `搜索「${q}」`
    : (qfLabel || (activeCat === "全部" ? "全部物品" : activeCat));
  $("itemsCount").textContent = `${list.length} 项`;

  $("itemsList").innerHTML = list.length
    ? list.map(itemHTML).join("")
    : emptyHTML(q ? "没找到" : "这一类还没有东西", q ? "换个关键词，或试试拼音首字母" : "点右下角 + 添加");
}

function renderMe(){
  const total = items.reduce((s,it) => s + (Number(it.qty) || 1), 0);
  $("sTotal").textContent = total;
  $("sKinds").textContent = new Set(items.map(it => it.name)).size;

  const counts = {};
  items.forEach(it => {
    const c = it.category || "其他";
    counts[c] = (counts[c] || 0) + (Number(it.qty) || 1);
  });
  const max = Math.max(1, ...Object.values(counts));
  const rows = CATS.map(c => {
    const n = counts[c] || 0;
    if(!n && items.length) return "";
    return `<div class="bar-row">
      <div class="lbl">${esc(c)}</div>
      <div class="track"><div class="fill" style="width:${Math.round(n/max*100)}%"></div></div>
      <div class="num">${n}</div>
    </div>`;
  }).join("");
  $("catBars").innerHTML = rows || `<div style="font-size:12.5px;color:var(--muted);">暂无数据</div>`;
}

/* 压到最长边 720px、JPEG 0.72，一张约 60–100KB，IndexedDB 存得下 */
function compressImage(file, maxSide, quality){
  maxSide = maxSide || 720;
  quality = quality || .72;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if(!w || !h){ URL.revokeObjectURL(url); reject(new Error("bad image")); return; }
      const scale = Math.min(1, maxSide / Math.max(w, h));
      const c = document.createElement("canvas");
      c.width = Math.round(w * scale);
      c.height = Math.round(h * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode failed")); };
    img.src = url;
  });
}

function photoKB(data){ return Math.round((data || "").length * .75 / 1024); }

function applyPhoto(data){

/* file:// 打开时 getUserMedia 会被浏览器拒（没有 origin 可授权），
   只有 https / localhost 才走实时取景，其余一律唤起系统相机 */
function canLiveCam(){
  const secure = location.protocol === "https:" ||
                 location.hostname === "localhost" || location.hostname === "127.0.0.1";
  return secure && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

$("btnShot").addEventListener("click", () => {
  if(canLiveCam()) openCam();
  else $("photoIn").click();   // capture="environment" 直接唤起手机相机
});

async function openCam(){
  $("cam").classList.add("show");
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: camFacing }, width: { ideal: 1600 }, height: { ideal: 1200 } },
      audio: false
    });
    const v = $("camVideo");
    v.srcObject = camStream;
    await v.play().catch(()=>{});
  }catch(err){
    closeCam();
    // file:// 或没授权时 getUserMedia 会被拒，自动降级到系统相机
    toast("摄像头打不开，改用系统相机/相册");
    $("photoIn").click();
  }
}

function closeCam(){
  $("cam").classList.remove("show");
  const v = $("camVideo");
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  if(v) v.srcObject = null;
}

function shoot(){
  const v = $("camVideo");
  const w = v.videoWidth, h = v.videoHeight;
  if(!w || !h){ toast("画面还没准备好，稍等一下"); return; }
  const scale = Math.min(1, 720 / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * scale);
  c.height = Math.round(h * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  const data = c.toDataURL("image/jpeg", .72);
  closeCam();
  applyPhoto(data);
}

$("camCancel").addEventListener("click", closeCam);
$("camShoot").addEventListener("click", shoot);
$("camFlip").addEventListener("click", async () => {
  camFacing = camFacing === "environment" ? "user" : "environment";
  const v = $("camVideo");
  if(camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  v.srcObject = null;
  try{
    camStream = await navigator.mediaDevices.getUserMedia({

    });
    v.srcObject = camStream;

});

$("btnImport").addEventListener("click", () => {

  input.onchange = () => {
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const arr = JSON.parse(String(reader.result));
        if(!Array.isArray(arr)) throw new Error("格式不对");
        const clean = arr.filter(x => x && x.name).map(x => ({
          id: x.id || uid(),
          name: x.name,
          category: x.category || "其他",
          room: x.room || "",
          cabinet: x.cabinet || "",
          drawer: x.drawer || "",
          qty: Number(x.qty) || 1,
          unit: x.unit || "个",
          expireAt: x.expireAt || null,
          lastUsedAt: x.lastUsedAt || todayStr(),
          createdAt: x.createdAt || todayStr(),
          note: x.note || "",
          photo: (typeof x.photo === "string" && x.photo.indexOf("data:image/") === 0) ? x.photo : null,
          updatedAt: x.updatedAt || todayStr(),
          deletedAt: null
        }));
        items = clean;
        await persist();
        renderAll();
        const nPhoto = clean.filter(x => x.photo).length;
        toast(nPhoto ? `已导入 ${clean.length} 项，含 ${nPhoto} 张照片` : `已导入 ${clean.length} 项`);
      }catch(err){
        toast("导入失败：文件格式不对");
      }
    };
    reader.readAsText(file);
  };
  input.click();
});

$("btnSeed").addEventListener("click", async () => {
  if(items.length && !confirm("这会用示例数据覆盖当前全部物品，继续？")) return;
  items = buildSeed();
  await persist();
  renderAll();
  toast("示例数据已恢复（24 件）");
});

$("btnClear").addEventListener("click", async () => {
  if(!confirm("清空后无法恢复，确定？")) return;
  items = [];
  await persist();
  renderAll();
  toast("已清空");
});

/* ==========================================================
   12. Toast
   ========================================================== */
let toastTimer = null;
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

/* ==========================================================
   13. 启动
   ========================================================== */
(async function boot(){
  await loadAll();
  if(!items.length){
    items = buildSeed();
    await persist();
  }
  buildCatPicker();
  $("seedHint").textContent = `${buildSeed().length} 条 ›`;
  renderAll();

  const cur = document.querySelector("nav button.on");
  if(cur) cur.classList.add("on");
})();
</script>
